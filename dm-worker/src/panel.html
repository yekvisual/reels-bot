<style>
:root {
  color-scheme: light dark;
  --zemin: #f6f5f2; --yuzey: #ffffff; --yuzey2: #faf9f7; --murekkep: #16181d; --soluk: #646a76; --silik: #9aa0ab; --cizgi: #e8e6e1; --cizgi2: #f0eeea;
  --mavi: #2f6bff; --mavi-koyu: #1f54d9; --mavi-acik: #eaf0ff; --iyi: #15803d; --iyi-acik: #e6f5ec; --kotu: #c62828; --kotu-acik: #fdecec;
  --uyari: #b45309; --uyari-acik: #fff3df; --mor: #7c3aed; --mor-acik: #f1eafe; --golge: 0 1px 2px rgb(16 18 24 / .04), 0 8px 24px rgb(16 18 24 / .05);
  --ig1: #feda75; --ig2: #d62976; --ig3: #4f5bd5;
}
@media (prefers-color-scheme: dark) {
  :root { --zemin: #0f1013; --yuzey: #17191e; --yuzey2: #1c1f25; --murekkep: #ecebe8; --soluk: #a3a6ad; --silik: #6f737b; --cizgi: #262930; --cizgi2: #20232a;
    --mavi: #6f95ff; --mavi-koyu: #8aa9ff; --mavi-acik: #1b2540; --iyi: #4ade80; --iyi-acik: #12301d; --kotu: #f87171; --kotu-acik: #3a1a1a;
    --uyari: #fbbf24; --uyari-acik: #3a2a0d; --mor: #a78bfa; --mor-acik: #261a40; --golge: 0 1px 2px rgb(0 0 0 / .3), 0 8px 24px rgb(0 0 0 / .3); }
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--zemin); color: var(--murekkep); font: 14px/1.5 Inter, system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
a { color: var(--mavi); text-decoration: none; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--mavi); outline-offset: 2px; border-radius: 6px; }
svg.ik { width: 18px; height: 18px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }

/* Kabuk */
.kabuk { display: grid; grid-template-columns: 240px 1fr; min-height: 100vh; }
.yan { background: var(--yuzey); border-right: 1px solid var(--cizgi); padding: 18px 12px 14px; display: flex; flex-direction: column; gap: 14px; position: sticky; top: 0; height: 100vh; }
.logo { font-weight: 700; font-size: 16px; padding: 0 8px; display: flex; align-items: center; gap: 9px; letter-spacing: -.01em; }
.logo i { width: 28px; height: 28px; border-radius: 9px; background: linear-gradient(135deg, var(--ig1), var(--ig2) 55%, var(--ig3)); display: grid; place-items: center; flex: none; }
.logo i svg { width: 16px; height: 16px; fill: none; stroke: #fff; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
.logo small { display: block; font-weight: 500; font-size: 11px; color: var(--soluk); letter-spacing: 0; }
.hesapSec { display: flex; align-items: center; gap: 10px; border: 1px solid var(--cizgi); border-radius: 12px; padding: 8px 10px; position: relative; background: var(--yuzey2); }
.avatar { width: 28px; height: 28px; border-radius: 50%; background: linear-gradient(135deg, var(--ig1), var(--ig2) 55%, var(--ig3)); color: #fff; display: grid; place-items: center; font-weight: 700; font-size: 12px; flex: none; }
.hesapSec select { appearance: none; border: 0; background: transparent; font: inherit; font-weight: 600; color: inherit; flex: 1; min-width: 0; cursor: pointer; padding-right: 14px; }
.hesapSec::after { content: "▾"; position: absolute; right: 10px; color: var(--soluk); pointer-events: none; }
nav.menu { display: grid; gap: 2px; }
nav.menu button { display: flex; align-items: center; gap: 10px; border: 0; background: none; font-weight: 500; color: var(--soluk); padding: 9px 10px; border-radius: 9px; cursor: pointer; text-align: left; white-space: nowrap; transition: background .12s, color .12s; }
nav.menu button:hover { background: var(--zemin); color: var(--murekkep); }
nav.menu button.secili { background: var(--mavi-acik); color: var(--mavi); font-weight: 600; }
nav.menu .sayac { margin-left: auto; font-size: 11px; font-weight: 600; color: var(--soluk); background: var(--zemin); border-radius: 99px; padding: 1px 7px; }
nav.menu button.secili .sayac { background: var(--yuzey); color: var(--mavi); }
.yanAlt { margin-top: auto; display: grid; gap: 7px; padding: 0 6px; font-size: 12px; color: var(--soluk); }
.nokta { display: inline-flex; align-items: center; gap: 7px; }
.nokta::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--silik); flex: none; }
.nokta.iyi::before { background: #22c55e; box-shadow: 0 0 0 3px #22c55e33; }
.nokta.uyari { color: var(--uyari); } .nokta.uyari::before { background: #f59e0b; }
.cikis { border: 0; background: none; color: var(--soluk); cursor: pointer; padding: 6px 0 0; text-align: left; font-size: 12px; display: inline-flex; gap: 6px; align-items: center; }
.cikis:hover { color: var(--murekkep); }

.anaAlan { min-width: 0; display: flex; flex-direction: column; }
.yoneticiSerit { background: var(--mor-acik); color: var(--mor); padding: 8px 24px; font-size: 13px; display: flex; gap: 10px; align-items: center; }
.yoneticiSerit button { border: 1px solid currentColor; background: none; color: inherit; border-radius: 8px; padding: 3px 10px; cursor: pointer; font-size: 12px; font-weight: 600; margin-left: auto; }
.serit { background: var(--uyari-acik); color: var(--uyari); border-bottom: 1px solid color-mix(in srgb, var(--uyari) 25%, transparent); padding: 10px 24px; display: flex; gap: 10px; align-items: flex-start; font-size: 13px; }
.serit.kotu { background: var(--kotu-acik); color: var(--kotu); }
.serit > div { flex: 1; display: grid; gap: 4px; }
.serit span { display: flex; gap: 8px; align-items: baseline; } .serit b { font-weight: 600; white-space: nowrap; }
.serit button { border: 0; background: none; color: inherit; cursor: pointer; opacity: .7; padding: 0 2px; font-size: 16px; line-height: 1; }
.serit button:hover { opacity: 1; }
.ustCubuk { position: sticky; top: 0; z-index: 4; background: color-mix(in srgb, var(--zemin) 88%, transparent); backdrop-filter: blur(10px); display: flex; align-items: center; gap: 10px; padding: 18px 28px 12px; }
.ustCubuk > * { flex: none; } .ustCubuk > div:first-child { flex: 0 1 auto; min-width: 0; }
.ustCubuk h1 { font-size: 22px; font-weight: 700; margin: 0; letter-spacing: -.02em; white-space: nowrap; }
.ustCubuk .alt { font-size: 13px; color: var(--soluk); margin-top: 1px; }
.bosluk { flex: 1; }
main { padding: 4px 28px 56px; max-width: 1180px; width: 100%; }

/* Düğmeler */
button.d, a.d { font: inherit; font-weight: 500; border: 1px solid var(--cizgi); background: var(--yuzey); color: var(--murekkep); padding: 8px 14px; border-radius: 9px; cursor: pointer;
  white-space: nowrap; display: inline-flex; align-items: center; gap: 7px; transition: border-color .12s, background .12s, transform .08s; }
button.d:hover, a.d:hover { border-color: var(--silik); }
button.d:active { transform: translateY(1px); }
.d.ana { background: var(--mavi); border-color: var(--mavi); color: #fff; font-weight: 600; }
.d.ana:hover { background: var(--mavi-koyu); border-color: var(--mavi-koyu); }
.d.ig { background: linear-gradient(135deg, #f58529, #dd2a7b 50%, #8134af); border: 0; color: #fff; font-weight: 600; }
.d.sil { color: var(--kotu); }
.d.ince { border: 0; background: none; padding: 6px 8px; color: var(--soluk); } .d.ince:hover { color: var(--murekkep); background: var(--zemin); }
.d.kucuk { padding: 5px 10px; font-size: 13px; border-radius: 8px; }
button:disabled, a.d.pasif { opacity: .5; cursor: default; pointer-events: none; }

/* Kutular */
.kutu { background: var(--yuzey); border: 1px solid var(--cizgi); border-radius: 14px; box-shadow: var(--golge); }
.kutuBaslik { display: flex; align-items: center; gap: 10px; padding: 14px 18px; border-bottom: 1px solid var(--cizgi2); }
.kutuBaslik h2 { font-size: 15px; font-weight: 600; margin: 0; }
.kutuIc { padding: 16px 18px; } .kutuIc > * { min-width: 0; }
.kutuAlt { padding: 10px 18px; border-top: 1px solid var(--cizgi2); color: var(--soluk); font-size: 12px; }
.ikili { display: grid; grid-template-columns: 1.7fr 1fr; gap: 16px; margin-top: 16px; }
.not { color: var(--soluk); font-size: 13px; }
.bos { color: var(--soluk); padding: 36px 18px; text-align: center; display: grid; gap: 10px; justify-items: center; }
.bos svg { width: 44px; height: 44px; stroke: var(--silik); stroke-width: 1.4; fill: none; stroke-linecap: round; stroke-linejoin: round; }
.bos b { color: var(--murekkep); font-size: 15px; }
.iskelet { background: linear-gradient(90deg, var(--cizgi2), var(--zemin), var(--cizgi2)); background-size: 200% 100%; animation: parla 1.2s infinite; border-radius: 8px; min-height: 14px; }
@keyframes parla { to { background-position: -200% 0; } }

/* Genel bakış */
.donem { display: inline-flex; background: var(--yuzey); border: 1px solid var(--cizgi); border-radius: 9px; padding: 2px; }
.donem button { white-space: nowrap; border: 0; background: none; font-weight: 500; color: var(--soluk); padding: 5px 12px; border-radius: 7px; cursor: pointer; }
.donem button.secili { background: var(--mavi-acik); color: var(--mavi); font-weight: 600; }
.kartlar { display: grid; grid-template-columns: repeat(6, 1fr); gap: 12px; }
.sayiKart { background: var(--yuzey); border: 1px solid var(--cizgi); border-radius: 14px; padding: 14px 16px; box-shadow: var(--golge); }
.sayiKart.one { border-color: var(--mavi); box-shadow: inset 0 0 0 1px var(--mavi), var(--golge); }
.sayiKart span { color: var(--soluk); font-size: 12.5px; font-weight: 500; }
.sayiKart b { display: block; font-size: 26px; font-weight: 700; letter-spacing: -.02em; margin: 2px 0; font-variant-numeric: tabular-nums; }
.sayiKart small { color: var(--silik); font-size: 12px; }
.grafik { padding-left: 30px; }
.cizim { position: relative; height: 200px; }
.izgaraCizgi { position: absolute; left: 0; right: 0; border-top: 1px solid var(--cizgi2); }
.izgaraCizgi span { position: absolute; right: calc(100% + 8px); top: -8px; font-size: 11px; color: var(--silik); font-variant-numeric: tabular-nums; }
.sutunlar { position: absolute; inset: 0; display: flex; gap: 2px; }
.gunSutun { flex: 1; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; outline: none; }
.cubuk { width: min(70%, 22px); background: var(--mavi); border-radius: 4px 4px 0 0; transition: height .3s; }
.cubuk.bugun { background: var(--mavi-koyu); }
.gunSutun:hover .cubuk, .gunSutun:focus-visible .cubuk { background: var(--mavi-koyu); box-shadow: 0 0 0 2px var(--mavi-acik); }
.xEtiket { display: flex; gap: 2px; margin-top: 6px; }
.xEtiket span { flex: 1; text-align: center; font-size: 11px; color: var(--silik); white-space: nowrap; overflow: visible; width: 0; }
.ipucu { position: absolute; pointer-events: none; background: var(--murekkep); color: var(--zemin); font-size: 12px; padding: 7px 10px; border-radius: 8px; transform: translate(-50%, calc(-100% - 8px)); white-space: nowrap; opacity: 0; transition: opacity .1s; }
.ipucu.gorunur { opacity: 1; } .ipucu b { font-weight: 600; }
.huni { display: grid; gap: 14px; }
.huni .ust { display: flex; justify-content: space-between; font-size: 13px; margin-bottom: 5px; } .huni .ust b { font-variant-numeric: tabular-nums; }
.huni .ray { height: 10px; background: var(--zemin); border-radius: 99px; overflow: hidden; }
.huni .dolu { height: 100%; background: linear-gradient(90deg, var(--mavi), var(--mor)); border-radius: 99px; min-width: 2px; transition: width .4s; }
.baslangic { display: grid; gap: 0; }
.baslangic .adim { display: flex; gap: 12px; align-items: flex-start; padding: 12px 18px; border-bottom: 1px solid var(--cizgi2); }
.baslangic .adim:last-child { border-bottom: 0; }
.baslangic i { width: 24px; height: 24px; border-radius: 50%; border: 2px solid var(--cizgi); display: grid; place-items: center; font-style: normal; font-size: 12px; font-weight: 700; color: var(--soluk); flex: none; margin-top: 1px; }
.baslangic .tamam i { background: var(--iyi); border-color: var(--iyi); color: #fff; }
.baslangic .tamam b { text-decoration: line-through; color: var(--soluk); font-weight: 500; }
.baslangic b { display: block; } .baslangic p { margin: 2px 0 0; color: var(--soluk); font-size: 13px; }
.siradaki { display: flex; gap: 14px; align-items: center; padding: 14px 18px; }
.siradaki .kapakVideo { width: 44px; height: 56px; }

/* Tablolar */
table { width: 100%; border-collapse: collapse; }
th { text-align: left; font-size: 12px; font-weight: 500; color: var(--soluk); padding: 10px 18px; border-bottom: 1px solid var(--cizgi2); white-space: nowrap; }
td { padding: 12px 18px; border-bottom: 1px solid var(--cizgi2); vertical-align: middle; }
tr:last-child td { border-bottom: 0; }
tbody tr.tik { cursor: pointer; } tbody tr.tik:hover { background: var(--yuzey2); }
td.s, th.s { text-align: right; font-variant-numeric: tabular-nums; }
.otoAd { display: flex; align-items: center; gap: 12px; min-width: 0; }
.kucukKapak { width: 40px; height: 50px; border-radius: 8px; background: var(--zemin) center / cover no-repeat; flex: none; display: grid; place-items: center; color: var(--silik); }
.otoAd b { display: block; font-weight: 600; }
.etiketler { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 3px; }
.etiket { font-size: 12px; background: var(--zemin); border: 1px solid var(--cizgi); border-radius: 6px; padding: 0 7px; color: var(--murekkep); }
.rozet { font-size: 12px; font-weight: 600; border-radius: 99px; padding: 2px 9px; white-space: nowrap; display: inline-flex; align-items: center; gap: 5px; }
.rozet.iyi { background: var(--iyi-acik); color: var(--iyi); } .rozet.uyari { background: var(--uyari-acik); color: var(--uyari); }
.rozet.kotu { background: var(--kotu-acik); color: var(--kotu); } .rozet.pasif { background: var(--zemin); color: var(--soluk); }
.rozet.mavi { background: var(--mavi-acik); color: var(--mavi); } .rozet.mor { background: var(--mor-acik); color: var(--mor); }
.rozet.canli::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; animation: nabiz 1.4s infinite; }
@keyframes nabiz { 50% { opacity: .3; } }

/* Anahtar */
.anahtar { position: relative; display: inline-block; width: 36px; height: 20px; flex: none; }
.anahtar input { opacity: 0; width: 0; height: 0; position: absolute; }
.anahtar i { position: absolute; inset: 0; background: var(--silik); border-radius: 99px; transition: background .15s; cursor: pointer; }
.anahtar i::after { content: ""; position: absolute; left: 2px; top: 2px; width: 16px; height: 16px; border-radius: 50%; background: #fff; transition: transform .15s; box-shadow: 0 1px 2px rgb(0 0 0 / .25); }
.anahtar input:checked + i { background: var(--mavi); } .anahtar input:checked + i::after { transform: translateX(16px); }
.anahtar input:focus-visible + i { outline: 2px solid var(--mavi); outline-offset: 2px; }
.secim { display: flex; align-items: center; gap: 10px; font-size: 14px; cursor: pointer; }
.secim small { color: var(--soluk); display: block; font-weight: 400; }

/* Paylaşım ızgarası */
.izgara { display: grid; grid-template-columns: repeat(auto-fill, minmax(168px, 1fr)); gap: 14px; }
.kart { background: var(--yuzey); border: 1px solid var(--cizgi); border-radius: 14px; overflow: hidden; cursor: pointer; text-align: left; padding: 0; display: flex; flex-direction: column; font: inherit; color: inherit; transition: transform .12s, box-shadow .12s; }
.kart:hover { transform: translateY(-2px); box-shadow: var(--golge); }
.kart.kurali { border-color: var(--mavi); box-shadow: inset 0 0 0 1px var(--mavi); }
.kapak { aspect-ratio: 4 / 5; background: var(--zemin) center / cover no-repeat; position: relative; }
.kapak .rozet { position: absolute; left: 8px; top: 8px; background: var(--mavi); color: #fff; max-width: calc(100% - 16px); overflow: hidden; text-overflow: ellipsis; display: block; }
.kapak .rozet.pasif { background: var(--soluk); color: #fff; }
.kart .alt { padding: 9px 11px 11px; font-size: 13px; }
.kart .aciklama { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.kart .ekle { color: var(--mavi); font-weight: 500; margin-top: 4px; font-size: 12px; }

/* Gönderiler */
.gonderiListe { display: grid; gap: 0; }
.gonderi { display: grid; grid-template-columns: 56px 1fr auto; gap: 14px; padding: 14px 18px; border-bottom: 1px solid var(--cizgi2); align-items: center; }
.gonderi:last-child { border-bottom: 0; }
.kapakVideo { width: 56px; height: 70px; border-radius: 10px; background: linear-gradient(160deg, #1d2a4b, #3a1d4b 60%, #4b1d2e); display: grid; place-items: center; color: #fff; position: relative; overflow: hidden; flex: none; }
.kapakVideo svg { width: 22px; height: 22px; fill: #fff; stroke: none; opacity: .9; }
.kapakVideo video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.gonderi .orta { min-width: 0; display: grid; gap: 3px; }
.gonderi .zaman { font-weight: 600; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.gonderi .aciklama { color: var(--soluk); font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.gonderi .meta { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; font-size: 12px; color: var(--soluk); }
.gonderi .eylem { display: flex; gap: 4px; }
.gonderi .hataMetin { color: var(--kotu); font-size: 12.5px; }
.bolumBaslik { display: flex; align-items: center; gap: 10px; margin: 20px 0 10px; font-size: 13px; font-weight: 600; color: var(--soluk); text-transform: uppercase; letter-spacing: .04em; }
.bolumBaslik:first-child { margin-top: 0; }

/* Olaylar */
.olaylar { list-style: none; margin: 0; padding: 0; }
.olaylar li { padding: 10px 18px; border-bottom: 1px solid var(--cizgi2); display: flex; gap: 12px; align-items: baseline; }
.olaylar li:last-child { border-bottom: 0; }
.olaylar time { color: var(--silik); white-space: nowrap; font-size: 12px; font-variant-numeric: tabular-nums; min-width: 88px; }
.olaylar .hata { color: var(--kotu); }

/* Formlar ve pencereler */
dialog { border: 0; border-radius: 16px; padding: 0; width: min(560px, calc(100vw - 32px)); background: var(--yuzey); color: var(--murekkep); box-shadow: 0 24px 70px rgb(10 12 20 / .3); max-height: calc(100vh - 32px); }
dialog.genis { width: min(780px, calc(100vw - 32px)); }
dialog::backdrop { background: rgb(10 12 20 / .45); backdrop-filter: blur(3px); }
dialog form, dialog .govde { padding: 22px; display: grid; gap: 14px; }
dialog h3 { margin: 0; font-size: 18px; font-weight: 700; letter-spacing: -.01em; }
label.alan { display: grid; gap: 5px; font-size: 13px; font-weight: 600; }
label.alan small, .alanNot { color: var(--soluk); font-weight: 400; font-size: 12px; }
input[type=text], input[type=search], input[type=password], input[type=datetime-local], input[type=number], textarea, select.alanSec { font: inherit; font-weight: 400; padding: 9px 11px; border: 1px solid var(--cizgi); border-radius: 9px; background: var(--yuzey); color: var(--murekkep); width: 100%; }
input:focus, textarea:focus, select:focus { outline: none; border-color: var(--mavi); box-shadow: 0 0 0 3px var(--mavi-acik); }
textarea { min-height: 90px; resize: vertical; }
.satir { display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; align-items: center; }
.sayacMetin { font-size: 12px; color: var(--silik); text-align: right; font-variant-numeric: tabular-nums; }
.istat { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.istat div { background: var(--zemin); border-radius: 9px; padding: 8px; text-align: center; }
.istat b { display: block; font-size: 20px; font-weight: 700; } .istat span { font-size: 11px; color: var(--soluk); }
.secIzgara { display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 10px; max-height: 52vh; overflow: auto; }
.secIzgara .kart .alt { padding: 6px 8px; font-size: 12px; }
.sablonlar { display: grid; gap: 16px; }

.sorular { display: grid; gap: 10px; }

.kod { font: 12.5px/1.6 ui-monospace, SFMono-Regular, Menlo, monospace; background: var(--zemin); border: 1px solid var(--cizgi); border-radius: 9px; padding: 10px 100px 10px 12px; white-space: pre-wrap; word-break: break-all; position: relative; }
.kod button { position: absolute; right: 6px; top: 6px; }
.anahtarKutu { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.anahtarKutu code { font: 13px ui-monospace, Menlo, monospace; background: var(--zemin); border: 1px solid var(--cizgi); border-radius: 8px; padding: 6px 10px; letter-spacing: .02em; }
.liste { list-style: none; margin: 0; padding: 0; }
.liste li { display: flex; align-items: center; gap: 12px; padding: 12px 18px; border-bottom: 1px solid var(--cizgi2); flex-wrap: wrap; }
.liste li:last-child { border-bottom: 0; }
.liste .icerik { flex: 1 1 220px; min-width: 0; } .liste b { display: block; }
.ipucuKutu { background: var(--mavi-acik); color: var(--murekkep); border-radius: 10px; padding: 10px 12px; font-size: 13px; display: flex; gap: 10px; align-items: flex-start; }
.ipucuKutu svg { color: var(--mavi); margin-top: 1px; }
.ipucuKutu ol { margin: 4px 0 0; padding-left: 18px; }

/* Video yükleme */
.birak { border: 2px dashed var(--cizgi); border-radius: 14px; padding: 22px; text-align: center; display: grid; gap: 6px; justify-items: center; cursor: pointer; transition: border-color .12s, background .12s; }
.birak:hover, .birak.ustunde { border-color: var(--mavi); background: var(--mavi-acik); }

.birak b { font-size: 14px; } .birak span { color: var(--soluk); font-size: 12px; }
.onizleme { display: grid; grid-template-columns: 96px 1fr; gap: 14px; align-items: center; padding: 10px; border: 1px solid var(--cizgi); border-radius: 12px; }
.onizleme video { width: 96px; height: 120px; object-fit: cover; border-radius: 9px; background: #000; }
.onizleme .bilgi { display: grid; gap: 4px; font-size: 13px; min-width: 0; } .onizleme b { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ilerleme { height: 6px; background: var(--zemin); border-radius: 99px; overflow: hidden; }
.ilerleme div { height: 100%; background: var(--mavi); transition: width .2s; }
.cipler { display: flex; gap: 6px; flex-wrap: wrap; }
.cip { border: 1px solid var(--cizgi); background: var(--yuzey); border-radius: 99px; padding: 4px 10px; font-size: 12px; cursor: pointer; }

details.katlanir { border: 1px solid var(--cizgi); border-radius: 12px; padding: 0; }

details.katlanir .ic { padding: 0 14px 14px; display: grid; gap: 12px; }

/* Yönetici */
.yonKartlar { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 16px; }
.planSec { padding: 4px 8px; border: 1px solid var(--cizgi); border-radius: 7px; background: var(--yuzey); color: inherit; font: inherit; font-size: 12px; }

/* Mesaj (toast) ve onay */
.mesaj { position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%) translateY(10px); background: var(--murekkep); color: var(--zemin); padding: 10px 16px; border-radius: 10px; font-size: 14px; opacity: 0; transition: opacity .2s, transform .2s; pointer-events: none; z-index: 30; max-width: calc(100vw - 32px); box-shadow: 0 10px 30px rgb(0 0 0 / .25); display: flex; gap: 8px; align-items: center; }

/* Mobil */
@media (max-width: 1100px) { .kartlar { grid-template-columns: repeat(3, 1fr); } .ikili { grid-template-columns: 1fr; } .yonKartlar { grid-template-columns: repeat(2, 1fr); } }

  .ustCubuk { padding: 14px 16px 10px; gap: 8px; } .ustCubuk h1 { font-size: 19px; } .ustCubuk .alt { display: none; }
  main { padding: 4px 16px 40px; }
  .kartlar { grid-template-columns: repeat(2, 1fr); } .kartlar .sayiKart:first-child { grid-column: 1 / -1; }
  .gizleDar { display: none !important; }

  .soru { grid-template-columns: 1fr; }
  dialog { max-height: calc(100vh - 16px); width: calc(100vw - 16px); }
}

<script>
// --- Temel yardımcılar ----------------------------------------------------------------
const $ = (s, k = document) => k.querySelector(s);
const el = (etiket, ozellik = {}, ...cocuk) => {
  const e = document.createElement(etiket);
  for (const [k, v] of Object.entries(ozellik)) {
    if (v == null || v === false) continue;
    if (k === "class") e.className = v;
    else if (k.startsWith("on")) e.addEventListener(k.slice(2), v);

    else if (k === "value" && "value" in e) e.value = v;

const IKON = {

};
const ikon = (ad, sinif = "ik") => {
  const s = document.createElementNS("http://www.w3.org/2000/svg", "svg");
  s.setAttribute("viewBox", "0 0 24 24"); s.setAttribute("class", sinif); s.setAttribute("aria-hidden", "true");
  const p = document.createElementNS("http://www.w3.org/2000/svg", "path"); p.setAttribute("d", IKON[ad]); s.append(p);
  return s;
};
const oynat = () => { const s = ikon("video"); s.innerHTML = '<path d="M8 5v14l11-7z"/>'; return s; };

const GORUNUMLER = [
  ["genel", "Genel bakış"], ["gonderi", "Gönderiler"], ["oto", "Otomasyonlar"], ["paylasim", "Paylaşımlar"],
  ["kisi", "Kişiler"], ["sablon", "Mesajlar"], ["olay", "Olaylar"], ["ayar", "Ayarlar"],
];
const BAGSIZ = "aciklama:";
const HIKAYE = "hikaye:";
const paylasimKurali = (k) => !k.medya.startsWith(BAGSIZ) && !k.medya.startsWith(HIKAYE);
const durum = {
  veri: null, hesap: null, paylasim: null, ozet: null, kural: null, kisiler: null, kisiSorgu: { q: "", kural: 0 }, gonderiler: null, yonetim: null,
  gorunum: GORUNUMLER.some(([g]) => g === location.hash.slice(1)) ? location.hash.slice(1) : "genel",
  donem: 7, gonderiTaslak: null,
};

let bildirZ;
function bildir(metin, tur = "") {
  const m = $("#mesaj"); m.replaceChildren(tur === "iyi" ? ikon("tik") : tur === "kotu" ? ikon("uyari") : "", metin);
  m.className = "mesaj gorunur " + tur;
  clearTimeout(bildirZ); bildirZ = setTimeout(() => m.classList.remove("gorunur"), tur === "kotu" ? 5000 : 2800);
}
const hataGoster = (e) => bildir(e?.message || String(e), "kotu");

function onayla(baslik, metin, dugme = "Sil", tehlikeli = true) {
  return new Promise((coz) => {
    const p = $("#onayPencere");
    $("#onayBaslik").textContent = baslik; $("#onayMetin").textContent = metin;
    const d = $("#onayDugme"); d.textContent = dugme; d.className = "d " + (tehlikeli ? "sil" : "ana");
    p.returnValue = ""; p.showModal();
    p.addEventListener("close", () => coz(p.returnValue === "tamam"), { once: true });
  });
}

async function istek(yol, secenek = {}) {
  const r = await fetch(yol, { headers: { "Content-Type": "application/json" }, ...secenek });
  const v = await r.json().catch(() => ({}));
  if (r.status === 401) { location.href = "/"; throw new Error("giriş"); }
  if (!r.ok) throw new Error(v.hata || r.statusText);
  return v;
}

function onceki(ms) {
  if (!ms) return "hiç";
  const s = (Date.now() - ms) / 1000;
  if (s < 90) return "az önce";
  if (s < 3600) return Math.round(s / 60) + " dk önce";
  if (s < 86400) return Math.round(s / 3600) + " sa önce";
  return Math.round(s / 86400) + " gün önce";
}
function sonra(ms) {
  const s = (ms - Date.now()) / 1000;
  if (s < 60) return "birazdan";
  if (s < 3600) return Math.round(s / 60) + " dk sonra";
  if (s < 86400) return Math.round(s / 3600) + " saat sonra";
  return Math.round(s / 86400) + " gün sonra";
}
const saat = (ms) => new Date(ms).toLocaleString("tr-TR", { day: "2-digit", month: "short", hour: "2-digit", minute: "2-digit" });
const tamTarih = (ms) => new Date(ms).toLocaleString("tr-TR", { weekday: "short", day: "2-digit", month: "long", hour: "2-digit", minute: "2-digit" });
const bin = (n) => Number(n || 0).toLocaleString("tr-TR");
const yuzde = (a, b) => (b ? Math.round((a / b) * 100) : 0) + "%";
const mb = (b) => (b / 1048576).toFixed(1).replace(".", ",") + " MB";
const hesapAdi = (id) => { const h = durum.veri?.hesaplar.find((x) => x.id === id); return h ? "@" + h.kullanici : "hesap"; };

function videoSec(dosya) {
  if (!dosya) return;
  if (!/\.(mp4|mov|m4v)$/i.test(dosya.name)) return bildir("Yalnızca MP4 ya da MOV", "kotu");
  if (dosya.size > 100 * 1048576) return bildir("Video 100 MB'tan büyük olamaz", "kotu");
  const t = durum.gonderiTaslak; t.dosyaNesnesi = dosya; t.dosya = null;
  $("#birak").hidden = true; $("#onizleme").hidden = false;
  $("#videoAd").textContent = dosya.name; $("#videoBilgi").textContent = mb(dosya.size);
  const v = $("#onizlemeVideo"); v.src = URL.createObjectURL(dosya);
  v.onloadedmetadata = () => {
    const sn = Math.round(v.duration), oran = v.videoWidth / v.videoHeight;
    const uyari = sn < 3 ? " · 3 saniyeden kısa, Instagram kabul etmez" : sn > 900 ? " · 15 dakikadan uzun, Instagram kabul etmez" : oran > 0.6 ? " · dikey (9:16) değil, Reels'te kırpılabilir" : "";
    $("#videoBilgi").textContent = mb(dosya.size) + " · " + Math.floor(sn / 60) + ":" + String(sn % 60).padStart(2, "0") + " · " + v.videoWidth + "×" + v.videoHeight + uyari;
  };
  videoYukle();
}

function videoYukle() {
  const t = durum.gonderiTaslak; if (!t.dosyaNesnesi) return;
  t.yukleniyor = true; $("#yuklemeCubugu").hidden = false; $("#yuklemeDurum").textContent = "Yükleniyor…"; $("#gonderiKaydet").disabled = true;
  const x = new XMLHttpRequest();
  x.open("PUT", "/api/video?ad=" + encodeURIComponent(t.dosyaNesnesi.name));
  x.upload.onprogress = (e) => { if (e.lengthComputable) $("#yuklemeCubugu div").style.width = Math.round((e.loaded / e.total) * 100) + "%"; };
  x.onload = () => {
    t.yukleniyor = false; $("#gonderiKaydet").disabled = false;
    let v = {}; try { v = JSON.parse(x.responseText); } catch {}
    if (x.status >= 200 && x.status < 300 && v.dosya) { t.dosya = v.dosya; $("#yuklemeDurum").textContent = "Yüklendi ✓"; $("#yuklemeCubugu").hidden = true; }
    else { $("#yuklemeDurum").textContent = "Yüklenemedi: " + (v.hata || x.statusText); $("#yuklemeCubugu").hidden = true; }
  };
  x.onerror = () => { t.yukleniyor = false; $("#gonderiKaydet").disabled = false; $("#yuklemeDurum").textContent = "Yüklenemedi: bağlantı hatası"; };
  x.send(t.dosyaNesnesi);
}

    el("div", { class: "kutu", style: "margin-top:16px" }, el("div", { class: "kutuBaslik" }, el("h2", {}, "Sistem olayları"), el("span", { class: "bosluk" }), el("span", { class: "not" }, "atölyelere ait olmayan kayıtlar")),
      olayListesi(60, y.kayit, [])));
}

yukle().catch((e) => { if (e.message !== "giriş") $("#uygulama").replaceChildren(el("p", { class: "bos" }, "Hata: " + e.message)); });
</script>
