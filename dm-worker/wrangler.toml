# Yorum → DM yanıtlayıcı (dm.py'nin Cloudflare Worker hali). Kurulum: README.md
name = "yeklab-dm"
main = "src/index.ts"
compatibility_date = "2026-09-01"
workers_dev = true
preview_urls = false

[[d1_databases]]
binding = "DB"
database_name = "yeklab-dm"
database_id = "997f4f7a-3137-42e0-8369-54013d7f242f"

[triggers]
# Her dakika: yorumlar (webhook'u App Review istiyor) ve webhook gelmiyorsa DM'ler
# Pazartesi 07:00 TR: token yenileme
crons = ["* * * * *", "0 4 * * 1"]

[vars]
# "1" = hiçbir şey göndermez, yalnızca olay günlüğüne yazar
DENEME = "0" # "1" yapılırsa yalnızca olay günlüğüne yazar (README: Eski sistemden geçiş)
# Teslim edilen linkler bu adresin altında kısa kodla gider; site 404 sayfası Worker'daki /l/<kod>'a sorar
LINK_KOK = "https://yeklab.com.tr/l"
# Tıklama sayacına JSON ile sorabilen site
SITE_KOK = "https://yeklab.com.tr"
# Panelden "Instagram ile bağla": Meta → uygulama → Instagram → API setup with Instagram login → Instagram app ID.
# Aynı sayfada Business login settings → OAuth redirect URIs'e https://yeklab-dm.yeklab.workers.dev/oauth eklenmeli.
INSTAGRAM_APP_ID = ""

# Gizli değerler (wrangler secret put …): APP_SECRET, VERIFY_TOKEN, PANEL_SIFRE, OTOMASYON_ANAHTARI (publish.py),
# TELEGRAM_TOKEN + TELEGRAM_CHAT (hata bildirimi), HEALTHCHECK_URL (isteğe bağlı: her dakika ping)

[[rules]]
type = "Text"
globs = ["**/*.html"]
fallthrough = true
